[workspace]
members = ["crates/smgw", "crates/smgw-cls", "xtask"]
resolver = "3"

[workspace.package]
version = "0.5.0"
authors = ["hupe1980"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hupe1980/smgw"
homepage = "https://hupe1980.github.io/smgw/"

[workspace.dependencies]
smgw-cls = { path = "crates/smgw-cls", version = "=0.5.0", default-features = false }
openssl = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt-multi-thread"] }
