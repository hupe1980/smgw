[package]
name = "smgw-cls"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Sans-I/O CLS session lifecycle and authenticated smart meter gateway simulator"
repository = "https://github.com/hupe1980/smgw-cls"
homepage = "https://hupe1980.github.io/smgw-cls/"
keywords = ["smgw", "cls", "bsi", "iec61850", "eebus"]
categories = ["network-programming", "embedded", "no-std"]
include = [
    "/src/**/*.rs", "/examples/*.rs", "/tests/lpc_bridge.rs",
    "/examples/fixtures/meter.cid", "/examples/fixtures/wakeup-v1.bin",
    "/examples/fixtures/wakeup-gwa-public.pem", "/examples/fixtures/wakeup-vector.md",
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT",
]

[features]
default = ["std"]
std = ["alloc"]
alloc = []
runtime = ["std", "dep:openssl", "dep:tokio", "dep:tokio-openssl"]
wakeup = []
wakeup-verify = ["wakeup", "std", "dep:openssl"]
wakeup-store = ["wakeup-verify", "dep:redb"]
fnn-bridge = ["std", "dep:iec61850-kit", "dep:eebus"]
simulator = ["runtime", "dep:iec61850-kit"]

[dependencies]
redb = { version = "5", optional = true }
eebus = { version = "0.13.1", default-features = false, optional = true }
openssl = { version = "0.10", optional = true }
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt-multi-thread"], optional = true }
tokio-openssl = { version = "0.6", optional = true }
iec61850-kit = { version = "0.5", default-features = false, features = ["server"], optional = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "mms_read"
required-features = ["simulator"]

[[example]]
name = "wakeup_verify"
required-features = ["wakeup-verify"]

[workspace]
members = ["xtask"]
resolver = "3"

[package.metadata.docs.rs]
all-features = true
