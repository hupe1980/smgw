name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to shared workspace version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '[.packages[].version] | unique | select(length == 1) | .[0]')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Expected tag v$version for this workspace"
            exit 1
          fi

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: crates-io-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io --workspace --exclude xtask
